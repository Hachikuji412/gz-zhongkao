</script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  html,body { height:100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color:#2c3e50; }
  #app { display:flex; flex-direction:column; height:100vh; }

  /* Header */
  #header { background: linear-gradient(135deg,#1e3c72,#2a5298); color:#fff; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 6px rgba(0,0,0,.15); z-index:1001; }
  #header h1 { font-size:18px; font-weight:600; }
  #header .sub { font-size:12px; opacity:.85; margin-top:2px; }
  #toggleSidebar { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  #toggleSidebar:hover { background:rgba(255,255,255,.25); }

  #main { flex:1; display:flex; overflow:hidden; position:relative; }

  /* Sidebar */
  #sidebar { width:300px; background:#f7f8fa; border-right:1px solid #e0e4e8; display:flex; flex-direction:column; transition:margin-left .25s; z-index:1000; }
  #sidebar.collapsed { margin-left:-300px; }
  .filters { padding:10px; border-bottom:1px solid #e0e4e8; background:#fff; }
  .filters .row { margin-bottom:8px; }
  .filters label { display:block; font-size:11px; color:#7f8c8d; margin-bottom:3px; }
  .filters select, .filters input { width:100%; padding:5px 6px; border:1px solid #d0d4d9; border-radius:4px; font-size:12px; background:#fff; }
  .filters .row2 { display:flex; gap:6px; }
  .filters .row2 > div { flex:1; }
  #schoolCount { font-size:11px; color:#7f8c8d; padding:4px 10px; background:#eef1f4; }

  #schoolList { flex:1; overflow-y:auto; }
  .school-item { padding:8px 12px; border-bottom:1px solid #eef1f4; cursor:pointer; font-size:12px; line-height:1.4; }
  .school-item:hover { background:#e8f0fe; }
  .school-item.active { background:#d2e3fc; border-left:3px solid #1a73e8; }
  .school-item .name { font-weight:600; color:#2c3e50; }
  .school-item .meta { color:#7f8c8d; font-size:11px; margin-top:2px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15); }

  /* Map */
  #map { flex:1; background:#dde4ea; }

  /* Legend */
  .legend { background:#fff; padding:10px 12px; border-radius:6px; box-shadow:0 1px 5px rgba(0,0,0,.2); font-size:12px; line-height:1.8; }
  .legend h4 { font-size:12px; margin-bottom:4px; color:#2c3e50; }
  .legend .lg-row { display:flex; align-items:center; }
  .legend .lg-row .dot { width:12px; height:12px; }
  .legend .sep { border-top:1px solid #eee; margin:6px 0; }

  /* Detail drawer */
  #detail { position:absolute; top:0; right:0; bottom:0; width:380px; background:#fff; box-shadow:-2px 0 12px rgba(0,0,0,.15); transform:translateX(100%); transition:transform .25s; overflow-y:auto; z-index:1050; }
  #detail.open { transform:translateX(0); }
  #detail .d-head { padding:14px 16px; background:#1e3c72; color:#fff; position:sticky; top:0; z-index:2; }
  #detail .d-head h2 { font-size:16px; line-height:1.3; }
  #detail .d-close { position:absolute; top:10px; right:12px; background:rgba(255,255,255,.2); border:none; color:#fff; width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; }

<script>
const SCHOOLS = JSON.parse(document.getElementById('schoolData').textContent);

const TIER_COLOR = { '第一梯队':'#c0392b', '第二梯队':'#e67e22', '第三梯队':'#f1c40f', '第四梯队':'#27ae60', '第五梯队':'#3498db', '第六梯队':'#95a5a6' };
const TIER_LABEL = { '第一梯队':'第一梯度线 712+', '第二梯队':'第二梯度线 672-711', '第三梯队':'第三梯度线 632-671', '第四梯队':'第四梯度线 592-631', '第五梯队':'第五梯度线 552-591', '第六梯队':'第六梯度线以下 492+' };

const map = L.map('map').setView([23.13, 113.26], 11);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'],
  maxZoom: 18, attribution: '&copy; 高德地图 AutoNavi'
}).addTo(map);

// build filters
function uniqueSorted(arr){ return Array.from(new Set(arr)).sort(); }
const districts = uniqueSorted(SCHOOLS.map(s=>s.district));
const tiers = ['第一梯队','第二梯队','第三梯队','第四梯队','第五梯队','第六梯队'];
const natures = uniqueSorted(SCHOOLS.map(s=>s.nature));
const batches = uniqueSorted(SCHOOLS.map(s=>s.batch));

function fillSelect(id, opts, labelMap){
  const sel = document.getElementById(id);
  opts.forEach(o=>{
    const opt=document.createElement('option');
    opt.value=o; opt.textContent = (labelMap?labelMap[o]:o) || o;
    sel.appendChild(opt);
  });
}
fillSelect('fDistrict', districts);
fillSelect('fTier', tiers, TIER_LABEL);
fillSelect('fNature', natures);
fillSelect('fBatch', batches);

// legend
const legend = L.control({position:'topright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  let h = '<h4>梯队图例</h4>';
  tiers.forEach(t=>{
    h += `<div class="lg-row"><span class="dot" style="background:${TIER_COLOR[t]}"></span>${TIER_LABEL[t]}</div>`;
  });
  h += '<div class="sep"></div>';
  h += '<div class="lg-row"><span class="dot" style="background:#555"></span>公办（实心）</div>';
  h += '<div class="lg-row"><span class="dot" style="background:#fff;border:2px solid #555"></span>民办/合作（空心）</div>';
  div.innerHTML = h;
  return div;
};
legend.addTo(map);

// marker size by score
function markerRadius(s){
  const sc = s.hukou_score || s.non_hukou_score || 500;
  // 480~740 -> 6~14
  const r = 6 + (sc-480)/260*8;
  return Math.max(5, Math.min(14, r));
}

function styleFor(s){
  const color = TIER_COLOR[s.tier] || '#95a5a6';
  const isPublic = s.nature === '公办';
  return {
    radius: markerRadius(s),
    fillColor: isPublic ? color : '#ffffff',
    color: color,
    weight: 2,
    opacity: 1,
    fillOpacity: isPublic ? 0.85 : 0.9
  };
}

const markers = [];
const nameToMarker = {};

SCHOOLS.forEach((s, idx) => {
  if (s.lat == null || s.lng == null) return;
  const m = L.circleMarker([s.lat, s.lng], styleFor(s));
  const tipHtml = `<div class="tname">${s.name}</div>
    <div class="tsub">户籍生：${s.hukou_score!=null?s.hukou_score+'分':'—'} · ${s.nature} · ${s.batch}</div>`;
  m.bindTooltip(tipHtml, {className:'school-tip', direction:'top', offset:[0,-6]});
  m.on('click', ()=> openDetail(s));
  m.addTo(map);
  markers.push({marker:m, school:s});
  nameToMarker[s.name] = m;
});

// sidebar list
const listEl = document.getElementById('schoolList');
const countEl = document.getElementById('schoolCount');

function fmtScore(v){ return v==null?'—':v; }

function renderList(){
  const q = document.getElementById('searchBox').value.trim();
  const fd = document.getElementById('fDistrict').value;
  const ft = document.getElementById('fTier').value;
  const fn = document.getElementById('fNature').value;
  const fb = document.getElementById('fBatch').value;
  const filtered = SCHOOLS.filter(s=>{
    if(q && !s.name.includes(q)) return false;
    if(fd && s.district!==fd) return false;
    if(ft && s.tier!==ft) return false;
    if(fn && s.nature!==fn) return false;
    if(fb && s.batch!==fb) return false;
    return true;
  });
  countEl.textContent = `共 ${filtered.length} / ${SCHOOLS.length} 所学校`;
  listEl.innerHTML = '';
  // filter markers visibility
  const fnames = new Set(filtered.map(s=>s.name));
  markers.forEach(({marker, school})=>{
    if(fnames.has(school.name)){
      if(!map.hasLayer(marker)) marker.addTo(map);
    } else {
      if(map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  // sort by hukou_score desc
  filtered.sort((a,b)=> (b.hukou_score||0)-(a.hukou_score||0));
  filtered.forEach(s=>{
    const div = document.createElement('div');
    div.className='school-item';
    div.dataset.name = s.name;
    const color = TIER_COLOR[s.tier]||'#999';
    const affShort = s.affiliation==='省属'?'省':s.affiliation==='市属'?'市':s.affiliation==='民办'?'民':'区';
    const affCls = s.affiliation==='省属'?'aff-tag-prov':s.affiliation==='市属'?'aff-tag-city':s.affiliation==='民办'?'aff-tag-priv':'aff-tag-dist';
    div.innerHTML = `<div class="name"><span class="dot" style="background:${color}"></span>${s.name}<span class="aff-tag ${affCls}">${affShort}</span></div>
      <div class="meta">${s.district} · ${s.nature} · ${s.batch} · 户籍${s.hukou_score!=null?s.hukou_score+'分':'暂无'}</div>`;
    div.onclick = ()=>{
      document.querySelectorAll('.school-item').forEach(e=>e.classList.remove('active'));
      div.classList.add('active');
      map.flyTo([s.lat, s.lng], 14, {duration:0.8});
      setTimeout(()=>openDetail(s), 400);
    };
    listEl.appendChild(div);
  });
}

['searchBox','fDistrict','fTier','fNature','fBatch'].forEach(id=>{
  document.getElementById(id).addEventListener('input', renderList);
});

// detail panel
const detailEl = document.getElementById('detail');
function natureBadge(n){
  if(n==='公办') return '<span class="badge badge-pub">公办</span>';
  if(n==='民办') return '<span class="badge badge-pri">民办</span>';
  return `<span class="badge badge-coop">${n}</span>`;
}
function affBadg(a){
  if(a==='省属') return '<span class="badge badge-prov">省属</span>';
  if(a==='市属') return '<span class="badge badge-city">市属</span>';
  if(a==='民办') return '<span class="badge badge-priv">民办</span>';
  return '<span class="badge badge-dist">区属</span>';
}
function allocSection(s){
  if(s.alloc_min_score==null) return '';
  const ts = s.alloc_top_senders||[];
  let senderHtml = '';
  if(ts.length){
    senderHtml = `<details class="sender-list"><summary>送生学校录取分（前${ts.length}）</summary><ol>` +
      ts.map(t=>`<li>${t.school} — ${t.score} 分</li>`).join('') +
      `</ol></details>`;
  }
  return `<div class="section"><h3>第二批次 · 名额分配</h3>
    <table class="dt">
      <tr><td class="k">最低分</td><td class="v">${s.alloc_min_score} 分</td></tr>
      <tr><td class="k">最高分</td><td class="v">${fmtScore(s.alloc_max_score)} 分</td></tr>
      <tr><td class="k">平均分</td><td class="v">${fmtScore(s.alloc_avg_score)} 分</td></tr>
      <tr><td class="k">送生学校数</td><td class="v">${fmtScore(s.alloc_sender_count)} 所</td></tr>
      <tr><td class="k">末位志愿序号范围</td><td class="v">${fmtScore(s.alloc_volunteer_range)}</td></tr>
    </table>${senderHtml}</div>`;
}
function rowSection(title, prefix, s){
  const sc = s[prefix+'_score'];
  if(sc==null) return '';
  return `<div class="section"><h3>${title}</h3>
    <table class="dt">
      <tr><td class="k">最低分</td><td class="v">${sc} 分</td></tr>
      <tr><td class="k">同分序号</td><td class="v">${fmtScore(s[prefix+'_rank'])}</td></tr>
      <tr><td class="k">末位志愿序号</td><td class="v">${fmtScore(s[prefix+'_last_volunteer'])}</td></tr>
      <tr><td class="k">末位考生分数</td><td class="v">${fmtScore(s[prefix+'_last_score'])}</td></tr>
      <tr><td class="k">末位考生同分序号</td><td class="v">${fmtScore(s[prefix+'_last_rank'])}</td></tr>
    </table></div>`;
}

function openDetail(s){
  document.getElementById('dName').textContent = s.name;
  let html = `<div>${natureBadge(s.nature)}
    ${affBadg(s.affiliation)}
    <span class="badge badge-cat">${s.category||'其他'}</span>
    <span class="badge badge-tier">${TIER_LABEL[s.tier]||s.tier}（参考划分，非官方）</span></div>`;
  html += `<div class="section"><h3>基本信息</h3>
    <table class="dt">
      <tr><td class="k">所属区</td><td class="v">${s.district||'—'}</td></tr>
      <tr><td class="k">招生范围</td><td class="v">${s.enrollment_range||'—'}</td></tr>
      <tr><td class="k">所属批次</td><td class="v">${s.batch||'—'}</td></tr>
      <tr><td class="k">招生总计划</td><td class="v">${s.total_plan!=null?s.total_plan+' 人':'—'}</td></tr>
      <tr><td class="k">名额分配计划</td><td class="v">${s.allocation_plan!=null?s.allocation_plan+' 人':'—'}</td></tr>
    </table></div>`;
  html += rowSection('户籍生（本市户籍）','hukou',s);
  html += rowSection('非户籍生（随迁子女）','non_hukou',s);
  html += rowSection('外区生','outer',s);
  html += allocSection(s);
  if(s.note){
    html += `<div class="note-box">⚠ ${s.note}</div>`;
  }
  document.getElementById('dBody').innerHTML = html;
  detailEl.classList.add('open');
}
document.getElementById('dClose').onclick = ()=> detailEl.classList.remove('open');

// sidebar toggle
document.getElementById('toggleSidebar').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(()=>map.invalidateSize(), 260);
};

renderList();
</script>
</body>
</html>
